<style>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

const I={check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',edit:'<path d="M4 20l1-4L16 5l3 3L8 19z"/><path d="M14 7l3 3"/>',

 const t=[['route','Mai út'],['plus','Hozzáad'],['map','Térkép'],['book','Címjegyzék']];$$('#tabs .tab').forEach((b,i)=>{b.innerHTML=ico(t[i][0],24)+'<span>'+t[i][1]+'</span>'})}

let tt;function toast(m,lab,fn){$('#tm').textContent=m;const b=$('#tb');$('#toast').style.display='flex';b.style.display=lab?'':'none';if(lab){b.textContent=lab;b.onclick=()=>{fn();$('#toast').style.display='none'}}clearTimeout(tt);tt=setTimeout(()=>$('#toast').style.display='none',lab?7000:3200)}

function openPage(title,body,foot){$('#page').innerHTML=`<div class="phd"><button class="ib" id="pb" aria-label="Vissza">${ico('back',24)}</button><div class="pt">${esc(title)}</div></div><div class="pbody">${body}</div>${foot?`<div class="pfoot">${foot}</div>`:''}`;$('#page').classList.add('on');$('#pb').onclick=closePage}
function closePage(){$('#page').classList.remove('on')}
function ask(title,msg,ok,danger){return new Promise(res=>{askRes=res;sheet(`<h3>${esc(title)}</h3><p class="mu" style="margin:0">${esc(msg)}</p><div class="btns"><button class="b2" onclick="closeSheet()">Mégse</button><button class="b1 ${danger?'dg':''}" id="aY">${esc(ok)}</button></div>`);$('#aY').onclick=()=>{askRes=null;closeSheet();res(true)}})}
function askText(title,val,ok){return new Promise(res=>{askRes=r=>res(null);sheet(`<h3>${esc(title)}</h3><input id="aT" value="${esc(val||'')}"><div class="btns"><button class="b2" onclick="closeSheet()">Mégse</button><button class="b1" id="aY">${esc(ok||'Mentés')}</button></div>`);$('#aY').onclick=()=>{const v=$('#aT').value.trim();askRes=null;closeSheet();res(v||null)}})}
document.addEventListener('pointerdown',e=>{const b=e.target.closest('button');if(b){b.classList.add('p');hap(18);setTimeout(()=>b.classList.remove('p'),1200)}});
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>$$('.p').forEach(b=>b.classList.remove('p'))));

// ---------- fülek ----------
function go(t){TAB=t;$$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t));$$('#tabs .tab').forEach(b=>b.classList.toggle('on',b.dataset.t===t));
 if(t==='route')renderRoute();if(t==='book')renderBook();if(t==='add')renderQuick();if(t==='map')openMap()}

// ---------- Mai út ----------
function seStrip(){const E=S.back?'Vissza a kezdőállomáshoz':(S.end?S.end.label:'nincs kiválasztva');
 return `<button class="se" onclick="openSE()"><div class="sg"><span class="lab">Rajt</span><b>${esc(S.start?S.start.label:'nincs kiválasztva')}</b></div><span class="ar">${ico('chev',18)}</span><div class="sg"><span class="lab">Vég</span><b>${esc(E)}</b></div></button>`}
function endRow(txt,label,cap,cls){return `<div class="st ${cls}"><div class="rl"><span class="nd fl">${ico('flag',15)}</span></div><div class="bd"><small>${cap}</small><b>${esc(label)}</b></div></div>`}
function rowHtml(a,n,isNext,first){const grip=EDIT?`<div class="dgb"><button class="ib" onclick="mv('${a.id}',-1)" aria-label="Fel">${ico('up',20)}</button><button class="ib" onclick="mv('${a.id}',1)" aria-label="Le">${ico('down',20)}</button><span class="gr" data-g="1">${ico('grip',22)}</span></div>`
 :`<button class="ck ${a.done?'on':''}" onclick="tick('${a.id}')" aria-label="Kész">${ico('check',22)}</button>`;
 return `<div class="st ${a.done?'dn':''} ${a.det?'br':''} ${isNext?'nx':''}" data-id="${a.id}"><div class="rl"><span class="nd">${a.done?ico('check',16):n}</span></div>
<div class="bd" onclick="toggleRow('${a.id}')"><b>${esc(a.client||a.label)}</b>${a.client?`<small>${esc(a.label)}</small>`:''}${a.note?`<small>${esc(a.note)}</small>`:''}${S.bId===a.id?'<span class="chip w">B · legtávolabbi</span>':''}${a.lock?'<span class="chip">kézi helyen</span>':''}${a.warn?`<span class="chip w">${esc(a.warn)}</span>`:''}${a.lat==null?'<span class="chip w">nincs koordináta</span>':''}</div>${grip}
<div class="ac"><button class="b1 sm" onclick="nav('${a.id}')">${ico('nav',18)} Indítás</button><button class="b2 sm" onclick="editStop('${a.id}')">${ico('edit',18)} Szerkeszt</button><button class="b2 sm dg" onclick="del('${a.id}')" aria-label="Törlés">${ico('trash',18)}</button></div></div>`}
function renderRoute(){const ord=ordList(),pend=ord.filter(a=>!a.done),dn=ord.length-pend.length;
 $('#rt-sub').textContent=EDIT?'Átrendezés: húzd a sort a fogantyúnál':today()+' · '+dn+' / '+ord.length+' kész';
 $('#rt-prog').style.width=(ord.length?Math.round(dn/ord.length*100):0)+'%';$('#eb').classList.toggle('on',EDIT);
 let h=seStrip();
 if(!EDIT&&S.dirty&&ord.length>1)h+=`<div class="bn"><div>A lista változott<small>Rendezd újra a megállókat</small></div><button class="b1 sm" onclick="runOpt()">Optimalizál</button></div>`;
 else if(!EDIT&&S.sum&&ord.length)h+=`<div class="sum">${esc(S.sum)}</div>`;
 if(!ord.length)h+=`<div class="c"><div class="mu" style="margin-bottom:14px">Még nincs megálló az útvonalon.</div><button class="b1" onclick="go('add')">${ico('plus',20)} Első cím hozzáadása</button></div>`;
 else{const nextId=(pend[0]||{}).id;h+='<div class="tl">';if(S.start)h+=endRow('A',S.start.label,'Rajt','first');let last=null;
  ord.forEach((a,i)=>{if(a.city!==last){last=a.city;h+=`<div class="sc"><span>${esc(a.city||'?')}</span>${a.det?`<em>${esc(a.role||'ág')}</em>`:''}</div>`}h+=rowHtml(a,i+1,a.id===nextId)});
  const E=S.back?S.start:S.end;if(E)h+=endRow('C',E.label,S.back?'Vissza a rajthoz':'Vég','last');h+='</div>'}
 $('#rt-body').innerHTML=h;nextBar(pend,ord);if(map)mapDraw()}
function nextBar(pend,ord){const el=$('#nextbar');
 if(EDIT){el.style.display='block';el.innerHTML=`<button class="b1 wide" onclick="setEdit(false)">Kész az átrendezéssel</button>`;return}
 if(!ord.length){el.style.display='none';return}el.style.display='block';const n=pend[0];
 if(!n){el.innerHTML=`<div class="nb"><span class="nd nx">${ico('check',18)}</span><div class="nbt"><small>Mai út</small><b>Minden megálló kész</b></div></div>`;return}
 el.innerHTML=`<div class="nb"><span class="nd nx">${S.order.indexOf(n.id)+1}</span><div class="nbt"><small>Következő</small><b>${esc(n.client||n.label)}</b>${n.client?`<small>${esc(n.label)}</small>`:''}</div><button class="b1" onclick="nav('${n.id}')">${ico('nav',18)} Indítás</button></div>`}
function toggleRow(id){if(EDIT)return;const r=$$('.st').find(x=>x.dataset.id===id);$$('.st.open').forEach(x=>{if(x!==r)x.classList.remove('open')});if(r)r.classList.toggle('open')}
function setEdit(v){EDIT=v;renderRoute()}
function tick(id){const a=byId(id);if(!a)return;a.done=!a.done;save();renderRoute();hap(a.done?[30,40,30]:20);toast(a.done?'Kész: '+(a.client||a.label):'Visszahelyezve','Visszavonás',()=>{a.done=!a.done;save();renderRoute()})}
async function del(id){const a=byId(id);if(!a)return;if(!await ask('Törlöd a megállót?',a.client||a.label,'Törlés',true))return;
 const i=S.order.indexOf(id),bk=JSON.parse(JSON.stringify(a));S.addrs=S.addrs.filter(x=>x.id!=id);S.order=S.order.filter(x=>x!=id);S.dirty=true;save();renderRoute();
 toast('Megálló törölve','Visszavonás',()=>{S.addrs.push(bk);S.order.splice(i,0,id);S.dirty=true;save();renderRoute()})}
function mv(id,d){const i=S.order.indexOf(id);let j=i+d;if(i<0||j<0||j>=S.order.length)return;[S.order[i],S.order[j]]=[S.order[j],S.order[i]];byId(id).lock=true;S.sum='';save();renderRoute()}
function nav(id){const a=byId(id);if(!a)return;if(a.lat==null){toast('Ehhez a megállóhoz nincs koordináta');return}
 const u={gm:`https://www.google.com/maps/dir/?api=1&destination=${a.lat},${a.lon}&travelmode=driving`,wz:`https://waze.com/ul?ll=${a.lat},${a.lon}&navigate=yes`,geo:`geo:${a.lat},${a.lon}?q=${a.lat},${a.lon}(${encodeURIComponent(a.client||a.label)})`}[S.nav]||'';
 const w=window.open(u,'_blank');if(!w)location.href=u}
// húzással átrendezés
document.addEventListener('pointerdown',e=>{const g=e.target.closest('.gr');if(!g||!EDIT)return;e.preventDefault();const el=g.closest('.st'),r=el.getBoundingClientRect();
 drag={el,id:el.dataset.id,off:e.clientY-r.top,sc:$('#rt-body')};el.classList.add('lift');try{g.setPointerCapture(e.pointerId)}catch(x){}hap(15)},{passive:false});
document.addEventListener('pointermove',e=>{if(!drag)return;e.preventDefault();const {el,sc}=drag,sr=sc.getBoundingClientRect();
 if(e.clientY<sr.top+70)sc.scrollTop-=12;else if(e.clientY>sr.bottom-70)sc.scrollTop+=12;
 el.style.transform='none';
 for(const r of [...sc.querySelectorAll('.st[data-id]')].filter(x=>x!==el)){const b=r.getBoundingClientRect();
  if(e.clientY>b.top&&e.clientY<b.bottom){if(e.clientY<b.top+b.height/2)r.parentNode.insertBefore(el,r);else r.parentNode.insertBefore(el,r.nextSibling);break}}
 const rr=el.getBoundingClientRect();el.style.transform=`translateY(${e.clientY-drag.off-rr.top}px)`},{passive:false});
function endDrag(){if(!drag)return;const {el,id}=drag;drag=null;el.style.transform='';el.classList.remove('lift');
 const ids=[...$('#rt-body').querySelectorAll('.st[data-id]')].map(x=>x.dataset.id),old=S.order.join();
 S.order=[...ids,...S.order.filter(x=>!ids.includes(x))];if(S.order.join()!==old){byId(id).lock=true;S.sum='';hap(25)}save();renderRoute()}
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,endDrag));
function routeMenu(){sheet(`<h3>Útvonal</h3>
<button class="opt" onclick="closeSheet();openSE()">${ico('flag',22)} Rajt, vég és optimalizálás</button>
<button class="opt" onclick="closeSheet();setEdit(true)">${ico('swap',22)} Sorrend átrendezése</button>
<button class="opt" onclick="closeSheet();lsSave()">${ico('check',22)} Útvonal mentése</button>
<button class="opt" onclick="closeSheet();lsSave(true)">${ico('plus',22)} Mentés más néven</button>
<button class="opt" onclick="closeSheet();openRoutes()">${ico('route',22)} Mentett útvonalak</button>
<button class="opt dg" onclick="closeSheet();newRoute()">${ico('trash',22)} Új útvonal (az előző törlése)</button>`)}
async function newRoute(){if(!S.addrs.length){toast('Nincs törölnivaló útvonal');return false}
 const key=l=>JSON.stringify((l.addrs||[]).map(a=>[a.id,a.done])),cur=key(S);
 if(!Object.values(S.lists).some(l=>key(l)===cur)&&await ask('Az útvonal nincs elmentve','Elmented törlés előtt?','Mentés')){await lsSave()}
 if(!await ask('Új útvonal indítása','A jelenlegi megállók, a sorrend és a pipák törlődnek.','Törlés',true))return false;
 const bk=JSON.parse(JSON.stringify({start:S.start,end:S.end,back:S.back,addrs:S.addrs,order:S.order,cur:S.cur,sum:S.sum,dirty:S.dirty,bId:S.bId}));
 S.addrs=[];S.order=[];S.cur='';S.sum='';S.dirty=false;S.bId='';save();EDIT=false;renderRoute();
 toast('Új útvonal indítva','Visszavonás',()=>{Object.assign(S,bk);save();renderRoute()});return true}

// ---------- megálló felvétele és szerkesztése ----------
function stopSheet(x,id){const a=id?byId(id):null,d=a||x;XT=x;
 sheet(`<h3>${a?'Megálló szerkesztése':'Új megálló'}</h3><span class="lbl" style="margin-top:8px">Cím</span><textarea id="dA" rows="2">${esc(d.label)}</textarea>
<span class="lbl">Vevő vagy vállalkozás neve</span><input id="dC" value="${esc(a?a.client:(x&&x.client)||'')}"><span class="lbl">Jegyzet</span><input id="dN" value="${esc(a?a.note||'':(x&&x.note)||'')}">
<div class="mu" style="margin-top:10px;font-size:13px">${d.lat!=null?'A hely megvan':'Nincs koordináta, a lista végére kerül'}</div>
<div class="btns"><button class="b2" onclick="closeSheet()">Mégse</button>${a?`<button class="b2" onclick="pickEdit('${a.id}')">${ico('pin',18)} Térképen</button>`:''}<button class="b1" onclick="stopSave('${id||''}')">${a?'Mentés':'Hozzáad'}</button></div>`)}
const editStop=id=>stopSheet(null,id);
function bookUpsert(x,chk,src){let e=x.bookId?S.book.find(b=>b.id===x.bookId):S.book.find(b=>b.client===(x.client||'')&&b.label===x.label&&(b.lat==null||x.lat==null||Math.abs(b.lat-x.lat)<.0005));
 if(!e){e={id:uid(),src:src||'kézi'};S.book.push(e)}Object.assign(e,{client:x.client||'',label:x.label,city:x.city||'',zip:x.zip||'',lat:x.lat??null,lon:x.lon??null,note:x.note||'',chk:!!chk,apx:!!x.apx});return e}
function mkAddr(x,client,note,bookId){const a={id:uid(),client:client||'',note:note||'',label:x.label,city:x.city||'?',zip:x.zip||'',lat:x.lat??null,lon:x.lon??null,done:false,lock:false,bookId:bookId||''};S.addrs.push(a);S.order.push(a.id);S.dirty=true;return a}
async function stopSave(id){const label=$('#dA').value.trim(),client=$('#dC').value.trim(),note=$('#dN').value.trim();if(!label){toast('A cím nem lehet üres');return}
 if(id){const a=byId(id);closeSheet();a.client=client;a.note=note;
  if(label!==a.label){a.label=label;const r=await sug(label.replace(/\([^)]*\)/g,' '));if(r[0]&&await ask('Új helyadat találtam',r[0].label,'Használom'))Object.assign(a,{lat:r[0].lat,lon:r[0].lon,city:r[0].city,zip:r[0].zip});S.dirty=true}
  if(a.bookId){const b=S.book.find(v=>v.id===a.bookId);if(b)Object.assign(b,{client:a.client,label:a.label,note:a.note,lat:a.lat,lon:a.lon,city:a.city,zip:a.zip,chk:false})}
  save();renderRoute();toast('Mentve');return}
 const x=XT||{};closeSheet();const b=bookUpsert({...x,label,client,note},false,'útvonal');mkAddr({...x,label},client,note,b.id);save();renderRoute();if(map)mapDraw();toast('Hozzáadva: '+(client||label))}
function pickEdit(id){closeSheet();pick={type:'edit',id};go('map');showPick('Koppints a megálló pontos helyére',true)}
function pickNew(){pick={type:'new'};go('map');showPick('Koppints a helyre, amit fel szeretnél venni',true)}
function showPick(msg){$('#pickbar').style.display='flex';$('#pickmsg').textContent=msg}
function cancelPick(){pick=null;$('#pickbar').style.display='none'}

// ---------- TomTom ----------
async function sug(q){if(!S.key){toast('Előbb add meg a TomTom API-kulcsot (Beállítások)');return[]}
 try{const r=await fetch(`https://api.tomtom.com/search/2/search/${encodeURIComponent(q)}.json?key=${S.key}&countrySet=HU&limit=6&typeahead=true&language=hu-HU&idxSet=PAD,Addr,Str,Geo`);
 if(!r.ok)throw 0;const j=await r.json();
 return(j.results||[]).map(x=>({label:x.address.freeformAddress,city:x.address.municipality||x.address.localName||'?',zip:x.address.postalCode||'',lat:x.position.lat,lon:x.position.lon}))}
 catch(e){toast('Keresési hiba: ellenőrizd a kulcsot és a netet');return[]}}
async function rev(lat,lon){if(!S.key)return null;try{const r=await fetch(`https://api.tomtom.com/search/2/reverseGeocode/${lat},${lon}.json?key=${S.key}&language=hu-HU`),j=await r.json(),ad=j.addresses&&j.addresses[0]&&j.addresses[0].address;
 return ad?{label:ad.freeformAddress,city:ad.municipality||ad.localName||'Térképről',zip:ad.postalCode||''}:null}catch(e){return null}}
function voice(inId){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){toast('Ez a böngésző nem támogatja a hangbevitelt');return}
 const r=new R(),b=$(inId==='bq'?'#mic2':'#mic');r.lang='hu-HU';r.interimResults=false;if(b)b.classList.add('rec');
 r.onresult=e=>{const i=$('#'+inId);i.value=e.results[0][0].transcript;i.dispatchEvent(new Event('input'))};
 r.onerror=()=>toast('A hangfelismerés nem sikerült');r.onend=()=>{if(b)b.classList.remove('rec')};r.start()}

// ---------- Hozzáadás ----------
function renderQuick(){const row=(ic,t,s,fn)=>`<button class="rowi" onclick="${fn}">${ico(ic,22)}<span class="t"><b>${t}</b><small>${s}</small></span>${ico('chev',18)}</button>`;
 $('#quick').innerHTML=`<span class="lbl">Más módon</span>`+row('cam','Fénykép a címjegyzékbe','A beolvasott címek szerkeszthetők','$(\'#ocrF\').click()')+row('paste','Szöveg beillesztése','Szállítási lista másolása','pasteDlg()')+row('loc','Jelenlegi hely','','addHere()')+row('pin','Koordináták','Szélesség, hosszúság','coordDlg()')+row('edit','Kézi rögzítés','Ha nincs találat','manualAdd()')}
function bookFind(q){const t=q.toLowerCase().split(/\s+/).filter(Boolean);return S.book.filter(b=>{const s=((b.client||'')+' '+b.label).toLowerCase();return t.every(w=>s.includes(w))}).slice(0,4)}
let qt;document.addEventListener('input',e=>{if(e.target.id!=='q')return;clearTimeout(qt);const q=e.target.value.trim(),box=$('#sug');
 if(q.length<2){box.innerHTML='';$('#quick').style.display='block';return}$('#quick').style.display='none';
 qt=setTimeout(async()=>{const bk=bookFind(q),r=q.length>=3?await sug(q):[];SRL=[...bk.map(e=>({k:'b',e})),...r.map(x=>({k:'t',x}))];
  box.innerHTML=SRL.map((it,i)=>it.k==='b'?`<button class="rowi" onclick="pickSug(${i})">${ico('book',22)}<span class="t"><b>${esc(it.e.client||it.e.label)}</b><small>${esc(it.e.label)}</small></span></button>`:`<button class="rowi" onclick="pickSug(${i})">${ico('pin',22)}<span class="t"><b>${esc(it.x.label)}</b><small>${esc(it.x.city)} ${esc(it.x.zip)}</small></span></button>`).join('')+`<button class="rowi" onclick="manualAdd()">${ico('edit',22)}<span class="t"><b>Kézi rögzítés</b><small>${esc(q)}</small></span></button>`},320)});
function pickSug(i){const it=SRL[i];$('#q').value='';$('#sug').innerHTML='';$('#quick').style.display='block';
 if(it.k==='b')stopSheet({...it.e,bookId:it.e.id});else stopSheet(it.x)}
function manualAdd(){const q=($('#q').value||'').trim();$('#q').value='';$('#sug').innerHTML='';stopSheet({label:q,city:'Koordináta nélkül'})}
function addHere(){navigator.geolocation.getCurrentPosition(async p=>{const lat=p.coords.latitude,lon=p.coords.longitude,r=await rev(lat,lon);stopSheet({lat,lon,label:r?r.label:'Jelenlegi hely',city:r?r.city:'?',zip:r?r.zip:''})},()=>toast('Nem érem el a helyadatot'),{enableHighAccuracy:true})}
function coordDlg(){sheet(`<h3>Koordináták</h3><input id="cI" placeholder="46.45, 17.00"><div class="btns"><button class="b2" onclick="closeSheet()">Mégse</button><button class="b1" onclick="coordAdd()">Tovább</button></div>`)}
async function coordAdd(){const m=$('#cI').value.match(/(-?\d+[.,]\d+)\D+(-?\d+[.,]\d+)/);if(!m){toast('Nem értem a koordinátákat');return}
 const lat=+m[1].replace(',','.'),lon=+m[2].replace(',','.'),r=await rev(lat,lon);stopSheet({lat,lon,label:r?r.label:lat.toFixed(5)+', '+lon.toFixed(5),city:r?r.city:'Koordinátából',zip:r?r.zip:''})}

// ---------- Címjegyzék ----------
function renderBook(){const q=($('#bq').value||'').trim().toLowerCase(),t=q.split(/\s+/).filter(Boolean);
 const list=S.book.filter(b=>{const s=((b.client||'')+' '+b.label+' '+(b.city||'')).toLowerCase();return t.every(w=>s.includes(w))}).sort((a,b)=>(b.chk?1:0)-(a.chk?1:0));
 $('#bk-sub').textContent=S.book.length+' bejegyzés'+(S.book.some(b=>b.chk)?' · ellenőrizendő van':'');
 $('#bk-body').innerHTML=list.length?list.map(b=>`<div class="bk"><button class="cb ${SEL.has(b.id)?'on':''}" onclick="selTog('${b.id}')" aria-label="Kijelölés"><span>${ico('check',16)}</span></button><div class="t" onclick="editBook('${b.id}')"><b>${esc(b.client||b.label)}</b>${b.client?`<small>${esc(b.label)}</small>`:''}${b.note?`<small>${esc(b.note)}</small>`:''}${b.chk?'<span class="chip w">ellenőrizendő</span>':''}${b.apx?'<span class="chip w">csak a település</span>':''}${b.lat==null?'<span class="chip w">nincs koordináta</span>':''}</div></div>`).join(''):`<div class="c mu">${S.book.length?'Nincs találat.':'A címjegyzék üres. Fényképről vagy szövegből töltheted fel, és az útvonalba felvett címek is ide kerülnek.'}</div>`;
 const bar=$('#bookbar');bar.style.display=SEL.size?'flex':'none';$('#bkadd').textContent='Hozzáad az útvonalhoz ('+SEL.size+')'}
document.addEventListener('input',e=>{if(e.target.id==='bq')renderBook()});
function selTog(id){SEL.has(id)?SEL.delete(id):SEL.add(id);renderBook()}
function selClear(){SEL.clear();renderBook()}
function selAdd(){let n=0;[...SEL].forEach(id=>{const b=S.book.find(v=>v.id===id);if(b){mkAddr(b,b.client,b.note,b.id);n++}});SEL.clear();save();go('route');toast(n+' megálló az útvonalon')}
function editBook(id){const b=S.book.find(v=>v.id===id);if(!b)return;
 sheet(`<h3>Címjegyzék-bejegyzés</h3><span class="lbl" style="margin-top:8px">Cím</span><textarea id="eA" rows="2">${esc(b.label)}</textarea><span class="lbl">Vevő vagy vállalkozás neve</span><input id="eC" value="${esc(b.client)}"><span class="lbl">Jegyzet</span><input id="eN" value="${esc(b.note)}">

async function bookSave(id){const b=S.book.find(v=>v.id===id),label=$('#eA').value.trim();if(!label)return;const ch=label!==b.label;closeSheet();

 return out}

// ---------- folyosó–ág optimalizáló (A → B → C) ----------
async function routeAlt(a,b){if(!S.key)return null;
 try{const r=await fetch(`https://api.tomtom.com/routing/1/calculateRoute/${a.lat},${a.lon}:${b.lat},${b.lon}/json?key=${S.key}&maxAlternatives=2&routeType=fastest&traffic=false&travelMode=car`);
  if(!r.ok)return null;const j=await r.json();
  const rs=(j.routes||[]).map(x=>({pts:x.legs.flatMap(l=>l.points.map(p=>({lat:p.latitude,lon:p.longitude})))})).filter(x=>x.pts.length>1);
  return rs.length?rs:null}catch(e){return null}}
function mkPoly(pts,xy){const P=pts.map(xy),cum=[0];for(let i=1;i<P.length;i++)cum.push(cum[i-1]+Math.hypot(P[i].x-P[i-1].x,P[i].y-P[i-1].y));return{P,cum}}
function proj(poly,q){let bd=Infinity,bs=0;const P=poly.P;
 for(let i=1;i<P.length;i++){const ax=P[i-1].x,ay=P[i-1].y,dx=P[i].x-ax,dy=P[i].y-ay,l2=dx*dx+dy*dy;let t=l2?((q.x-ax)*dx+(q.y-ay)*dy)/l2:0;t=Math.max(0,Math.min(1,t));
  const d=Math.hypot(q.x-ax-t*dx,q.y-ay-t*dy);if(d<bd){bd=d;bs=poly.cum[i-1]+t*Math.sqrt(l2)}}
 return{d:bd,s:bs}}
// Több lehetséges út közül azt választjuk, amelyik a legtöbb települést érinti (nem a legrövidebbet)
function pickAlt(polys,pend,XY,T){let best=null,bk=null;polys.forEach(po=>{const cd={};let sum=0;pend.forEach(a=>{const d=proj(po,XY.get(a.id)).d;sum+=d;cd[a.city]=Math.min(cd[a.city]??Infinity,d)});
  const cov=Object.values(cd).filter(d=>d<=T).length,key=[-cov,sum,po.cum[po.cum.length-1]];
  if(!bk||key[0]<bk[0]||(key[0]===bk[0]&&(key[1]<bk[1]||(key[1]===bk[1]&&key[2]<bk[2])))){bk=key;best=po}});return best}
async function optimize(keep){const pend=S.addrs.filter(a=>!a.done&&a.lat!=null);

 for(let i=0;i<cities.length;i++)for(let j=i+1;j<cities.length;j++)if(cdist(cities[i],cities[j])<Math.min(cityD[cities[i]],cityD[cities[j]]))uf[fd(cities[i])]=fd(cities[j]);
